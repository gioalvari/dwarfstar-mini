name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make dsm check-metal-gemv check-prefill check-rewind check-attn bench-prefill bench-gemv gguf-inspect
      - name: Unit tests
        run: make test
      - name: Compile Metal kernels
        run: |
          if xcrun -sdk macosx -f metal >/dev/null 2>&1; then
            xcrun -sdk macosx metal -std=metal3.1 -c metal/dsm.metal -o "$RUNNER_TEMP/dsm.air"
          else
            echo "::warning::Metal compiler not available on this runner; kernels not compiled"
          fi
